name: Iskra Learn checks

on:
  push:
    paths:
      - "adaptive-learning/**"
      - ".github/workflows/adaptive-learning-tests.yml"
  pull_request:
    paths:
      - "adaptive-learning/**"
      - ".github/workflows/adaptive-learning-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adaptive-learning
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript and run tests
        run: npm run check
